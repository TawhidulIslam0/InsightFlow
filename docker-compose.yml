services:
  db:
    image: postgres:16-alpine
    container_name: insightflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insightflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  ml-service:
    build: ./ml-service
    container_name: insightflow-ml
    ports: ["8000:8000"]
  backend:
    build: ./backend
    container_name: insightflow-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insightflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      ML_SERVICE_URL: http://ml-service:8000
      CLIENT_URL: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db: {condition: service_healthy}
      ml-service: {condition: service_started}
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
  frontend:
    build: ./frontend
    container_name: insightflow-frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres-data:
